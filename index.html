<html lang="es"><head><meta charset="utf-8"><title>Lina Mosquera · Control de Ingresos</title>

<style>
:root{--bg:#fff6fa;--card:#fff;--tx:#33202b;--mu:#8a6f7e;--ac:#e0197d;--ac2:#f9d3e3;--bd:#f0d9e3;--ok:#1f8a4c;--bad:#c0392b;--g1:#e0197d;--g2:#f3a6c8;--fb:#efe4ff;--ft:#5b2bb8;--fbd:#a67cf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1318;--card:#2a1c23;--tx:#fbeaf2;--mu:#c7a6b6;--ac:#ff5aa9;--ac2:#4a2338;--bd:#44303b;--g1:#ff5aa9;--g2:#8e3a62;--fb:#3a2a5c;--ft:#d2b8ff;--fbd:#7c5cc4}}
:root[data-theme="dark"]{--bg:#1d1318;--card:#2a1c23;--tx:#fbeaf2;--mu:#c7a6b6;--ac:#ff5aa9;--ac2:#4a2338;--bd:#44303b;--g1:#ff5aa9;--g2:#8e3a62;--fb:#3a2a5c;--ft:#d2b8ff;--fbd:#7c5cc4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;margin-bottom:10px}
header img{height:84px;width:auto}header div{flex:1}header h1{font:italic 700 20px Georgia,serif;margin:0;color:var(--ac)}header small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font:italic 700 17px Georgia,serif;margin:0 0 8px;color:var(--ac)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{background:var(--ac2);text-align:left;padding:7px;font-size:13px}td{padding:6px 7px;border-bottom:1px solid var(--bd)}
.n{text-align:right;white-space:nowrap}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select{padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.row input,.row select{flex:1 1 120px}.row input.w{flex:2 1 170px}
.tot td{font-weight:700;border-top:2px solid var(--ac)}.debe{color:var(--bad);font-weight:700}.pag{color:var(--ok);font-weight:700}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}.kpi small{color:var(--mu)}.kpi b{display:block;font-size:19px}
.mu{color:var(--mu);font-size:13px}.hide{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .h{text-align:center;font-size:12px;color:var(--mu);padding:3px}
.cal button{min-height:54px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;padding:3px;font:inherit;font-size:13px;position:relative}
.cal button.hoy{border-color:var(--ac);font-weight:700}.cal button.fest{background:var(--fb);border-color:var(--fbd);color:var(--ft)}.cal button.on{background:var(--ac);color:#fff}
.cal button i{display:block;font-style:normal;font-size:11px;color:var(--ac);font-weight:700}.cal button.on i{color:#fff}
td input{width:100%;min-width:85px}.x.ed{color:var(--ac)}.tm{display:flex;gap:4px;flex:1 1 200px}.tm select{flex:1}.leg{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:6px}.leg s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
.tbtn{flex:1 1 120px;text-align:left;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.clk{position:fixed;inset:0;background:rgba(51,32,43,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.clkc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;width:100%;max-width:320px;box-shadow:0 10px 30px rgba(224,25,125,.25)}
.clkd{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;font:700 38px Georgia,serif;color:var(--tx)}
.clkd>button{font:inherit;background:var(--ac2);color:var(--tx);border:0;border-radius:12px;padding:4px 12px;cursor:pointer}
.clkd>button.on{background:var(--ac);color:#fff}
.clap{display:flex;flex-direction:column;gap:4px;margin-left:8px}
.clap button{font:600 13px system-ui,Segoe UI,Arial,sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 8px;cursor:pointer}
.clap button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.clkf{width:100%;max-width:240px;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.clka{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
</style></head><body><main>
<header><img src="logo.png" alt="Lina Mosquera Nail Artist"><div><h1>Control de Ingresos</h1><small>Lina Mosquera · Nail Artist</small></div></header>
<nav id="nav"></nav><div id="v"></div>
<div class="card mu">Los datos se guardan en este dispositivo. <button class="btn" onclick="exp()">Respaldo ⬇</button> <label class="btn">Restaurar ⬆<input type="file" accept=".json" class="hide" onchange="imp(this)"></label> <button class="btn p" onclick="xls()">Descargar Excel 📗</button></div>
<script>
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],DIA=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const SEED={fijos:[{f:"2026-10-01",c:"Daniel Torres",s:"Pedicura semi",v:30000}],citas:[],creditos:[{"n":"Jader sucerquia","s":[["2026-09-19","Manicura Semi",25000]],"p":[]},{"n":"Valentina Zabala","s":[["2026-07-30","Pedicura Semi",40000],["2026-09-12","Pedicura Semi",40000]],"p":[]},{"n":"Tatiana Zabala","s":[["2026-09-08","Limpieza de Manos- pedicura Semi",62000]],"p":[]},{"n":"Gladis Osorio","s":[["2026-07-31","Pedicura Semi",40000]],"p":[]},{"n":"Bera Duran","s":[["2026-09-05","Manicura Press On y pedicura semi (Mariangel)",60000],["2026-09-19","Maquillaje de uñas mano y Retiro semi (de otro lugar)",21000],["2026-09-19","Pedicura semi",40000]],"p":[]},{"n":"Mona Patiño","s":[["2025-08-13","Saldo anterior",100000],["2026-09-02","Limpieza uñas de manos y pedicura semi",63000]],"p":[]},{"n":"Nancy Espinosa","s":[["2026-06-25","Saldo anterior",157000],["2026-07-03","Manicura Semi",35000],["2026-08-03","pedicura Semi",40000],["2026-08-18","Manicura Semi",35000],["2026-09-11","pedicura Semi",40000]],"p":[["2026-08-28",100000]]},{"n":"Ana María Patiño","s":[["2026-07-05","Pedicura Semi",40000],["2026-07-26","Manicura Semi",40000],["2026-06-23","Pedicura Semi",40000],["2026-08-25","Manicura Semi",40000]],"p":[["2026-08-27",100000]]}]};
function localISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
let D,tab="res",year=2026,sel=0,gp="mes",cm=localISO().slice(0,7),cd=localISO();
try{D=JSON.parse(localStorage.getItem("ci_data"))}catch(e){}
if(!D||!D.fijos||(!D.fijos.length&&!(D.creditos||[]).length))D=JSON.parse(JSON.stringify(SEED));
D.citas=D.citas||[];
const save=()=>{try{localStorage.setItem("ci_data",JSON.stringify(D))}catch(e){}};
const $=n=>"$ "+Math.round(n).toLocaleString("es-CO");
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=s=>s?s.split("-").reverse().join("/"):"";const sum=a=>a.reduce((x,y)=>x+y,0);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const tot=c=>{const v=sum(c.s.map(x=>x[2])),a=sum(c.p.map(x=>x[1]));return{v,a,d:v-a}};
const g=i=>document.getElementById(i).value;
const HC={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),r=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*r+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)}
function fest(y){if(HC[y])return HC[y];const H={},iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),nm=d=>{const w=d.getDay();return w==1?d:add(d,(8-w)%7)};
 [[1,1,"Año Nuevo"],[5,1,"Día del Trabajo"],[7,20,"Día de la Independencia"],[8,7,"Batalla de Boyacá"],[12,8,"Inmaculada Concepción"],[12,25,"Navidad"]].forEach(([m,d,n])=>H[iso(new Date(y,m-1,d))]=n);
 [[1,6,"Reyes Magos"],[3,19,"San José"],[6,29,"San Pedro y San Pablo"],[8,15,"Asunción de la Virgen"],[10,12,"Día de la Raza"],[11,1,"Todos los Santos"],[11,11,"Independencia de Cartagena"]].forEach(([m,d,n])=>H[iso(nm(new Date(y,m-1,d)))]=n);
 const P=easter(y);H[iso(add(P,-3))]="Jueves Santo";H[iso(add(P,-2))]="Viernes Santo";H[iso(nm(add(P,39)))]="Ascensión del Señor";H[iso(nm(add(P,60)))]="Corpus Christi";H[iso(nm(add(P,68)))]="Sagrado Corazón";return HC[y]=H}
const HOL=k=>fest(+k.slice(0,4))[k];
const fmtH=h=>{const [a,b]=h.split(":").map(Number);return(a%12||12)+":"+String(b).padStart(2,"0")+(a<12?" a. m.":" p. m.")};
let CF={f:today(),t:"09:00",c:"",s:"",n:""},ed="";
function evs(){const r=[];D.fijos.forEach(x=>r.push({f:x.f,v:x.v,t:0,c:x.c,s:x.s}));D.creditos.forEach(c=>c.p.forEach(p=>{if(p[0])r.push({f:p[0],v:p[1],t:1,c:c.n,s:"Abono"})}));return r}
function months(y){const m=Array.from({length:12},()=>[0,0]);evs().forEach(x=>{if(+x.f.slice(0,4)===y)m[+x.f.slice(5,7)-1][x.t]+=x.v});return m}
function render(){nav.innerHTML=[["res","📊 Resumen"],["gra","📈 Gráfica"],["cit","📅 Citas"],["fij","👤 Fijos"],["cre","🧾 Créditos"]].map(([k,t])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';ed='';render()">${t}</button>`).join("");
 v.innerHTML={res:rRes,gra:rGra,cit:rCit,fij:rFij,cre:rCre}[tab]()}
function years(){return[...new Set([2026,year,...evs().map(x=>+x.f.slice(0,4))])].sort()}
function rRes(){const m=months(year),T=sum(m.map(x=>x[0]+x[1])),pend=sum(D.creditos.map(c=>tot(c).d));
 return `<div class="kpis"><div class="kpi"><small>Ingresos ${year}</small><b>${$(T)}</b></div><div class="kpi"><small>Clientes fijos</small><b>${$(sum(m.map(x=>x[0])))}</b></div><div class="kpi"><small>Abonos de créditos</small><b>${$(sum(m.map(x=>x[1])))}</b></div><div class="kpi"><small>Por cobrar (total)</small><b class="debe">${$(pend)}</b></div></div>
 <div class="card"><div class="row"><h2 style="flex:1;margin:0">Ingresos por mes</h2><select style="flex:0 0 100px" onchange="year=+this.value;render()">${years().map(y=>`<option ${y==year?"selected":""}>${y}</option>`).join("")}</select></div>
 <div class="sc"><table><tr><th>Mes</th><th class="n">Fijos</th><th class="n">Abonos</th><th class="n">Total</th></tr>${m.map((x,i)=>`<tr><td>${MES[i]}</td><td class="n">${$(x[0])}</td><td class="n">${$(x[1])}</td><td class="n"><b>${$(x[0]+x[1])}</b></td></tr>`).join("")}
 <tr class="tot"><td>Total ${year}</td><td class="n">${$(sum(m.map(x=>x[0])))}</td><td class="n">${$(sum(m.map(x=>x[1])))}</td><td class="n">${$(T)}</td></tr></table></div></div>
 <div class="card"><h2>Saldos por cliente con crédito</h2><div class="sc"><table><tr><th>Cliente</th><th class="n">Valor</th><th class="n">Abonó</th><th class="n">Saldo</th></tr>
 ${D.creditos.map((c,i)=>{const t=tot(c);return `<tr><td><a href="#" onclick="tab='cre';sel=${i};render();return false" style="color:var(--ac)">${e(c.n)}</a></td><td class="n">${$(t.v)}</td><td class="n">${$(t.a)}</td><td class="n ${t.d>0?"debe":"pag"}">${$(t.d)}</td></tr>`}).join("")}
 <tr class="tot"><td>TOTAL</td><td class="n">${$(sum(D.creditos.map(c=>tot(c).v)))}</td><td class="n">${$(sum(D.creditos.map(c=>tot(c).a)))}</td><td class="n debe">${$(pend)}</td></tr></table></div></div>`}
function buckets(){const E=evs().filter(x=>+x.f.slice(0,4)===year||gp=="ano"),B={};
 const put=(k,x,o)=>{(B[k]=B[k]||{k,o,a:0,b:0})[x.t?"b":"a"]+=x.v};
 E.forEach(x=>{const y=+x.f.slice(0,4),m=+x.f.slice(5,7)-1,d=new Date(x.f+"T00:00:00");
  if(gp=="sem"){const w=Math.floor((d-new Date(y,0,1))/864e5/7)+1;put("S"+w,x,w)}
  else if(gp=="mes")put(MES[m].slice(0,3),x,m);else if(gp=="tri")put("T"+(Math.floor(m/3)+1),x,Math.floor(m/3));
  else if(gp=="sm")put("Sem "+(m<6?1:2),x,m<6?0:1);else put(""+y,x,y)});
 let L=Object.values(B);if(gp=="mes")L=MES.map((n,i)=>B[n.slice(0,3)]||{k:n.slice(0,3),o:i,a:0,b:0});
 if(gp=="tri")L=[0,1,2,3].map(i=>B["T"+(i+1)]||{k:"T"+(i+1),o:i,a:0,b:0});
 if(gp=="sm")L=[0,1].map(i=>B["Sem "+(i+1)]||{k:"Sem "+(i+1),o:i,a:0,b:0});
 return L.sort((a,b)=>a.o-b.o)}
function rGra(){const L=buckets(),mx=Math.max(1,...L.map(x=>x.a+x.b)),W=Math.max(320,L.length*(gp=="sem"?26:60)),H=220,bw=W/L.length,best=L.reduce((a,b)=>(b.a+b.b>(a?a.a+a.b:-1))?b:a,null);
 const bars=L.map((x,i)=>{const t=x.a+x.b,h=t/mx*(H-40),ha=x.a/mx*(H-40),hb=x.b/mx*(H-40),X=i*bw+bw*.15,w=bw*.7;
  return `<rect x="${X}" y="${H-20-hb}" width="${w}" height="${hb}" fill="var(--g2)" rx="3"/><rect x="${X}" y="${H-20-hb-ha}" width="${w}" height="${ha}" fill="var(--g1)" rx="3"/>${t?`<text x="${X+w/2}" y="${H-24-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${t>=1e6?(t/1e6).toFixed(1)+"M":Math.round(t/1000)+"k"}</text>`:""}<text x="${X+w/2}" y="${H-5}" text-anchor="middle" font-size="11" fill="var(--mu)">${L[i].k}</text>`}).join("");
 const sel=(id,vals,cur,f)=>`<select onchange="${f}">${vals.map(([k,t])=>`<option value="${k}" ${k==cur?"selected":""}>${t}</option>`).join("")}</select>`;
 return `<div class="card"><div class="row">${sel("",[["sem","Por semana"],["mes","Por mes"],["tri","Por trimestre"],["sm","Por semestre"],["ano","Por año"]],gp,"gp=this.value;render()")}${gp=="ano"?"":sel("",years().map(y=>[y,y]),year,"year=+this.value;render()")}</div>
 <div class="sc"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="min-width:100%;max-width:none" role="img" aria-label="Ingresos">${bars}</svg></div>
 <div class="leg"><span><s style="background:var(--g1)"></s>Clientes fijos</span><span><s style="background:var(--g2)"></s>Abonos</span></div></div>
 <div class="kpis"><div class="kpi"><small>Total del período</small><b>${$(sum(L.map(x=>x.a+x.b)))}</b></div><div class="kpi"><small>Mejor período</small><b>${best&&best.a+best.b?e(best.k)+" · "+$(best.a+best.b):"—"}</b></div></div>`}
function sh(m){const [Y,M]=cm.split("-").map(Number),d=new Date(Y,M-1+m,1);cm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function rCit(){const [Y,M]=cm.split("-").map(Number),first=(new Date(Y,M-1,1).getDay()+6)%7,dim=new Date(Y,M,0).getDate();
 const by={};D.citas.forEach(c=>(by[c.f]=by[c.f]||[]).push(c));let cells=DIA.map(d=>`<div class="h">${d}</div>`).join("")+"<span></span>".repeat(first);
 for(let d=1;d<=dim;d++){const k=`${cm}-${String(d).padStart(2,"0")}`,n=(by[k]||[]).length;cells+=`<button title="${HOL(k)||""}" class="${k==today()?"hoy ":""}${HOL(k)?"fest ":""}${k==cd?"on":""}" onclick="cd='${k}';CF.f=cd;render()">${d}${n?`<i>● ${n}</i>`:""}</button>`}
 const day=(by[cd]||[]).sort((a,b)=>a.h.localeCompare(b.h)),up=D.citas.filter(c=>c.f>=today()).sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h)).slice(0,8);
 return `<div class="card"><div class="row"><button class="btn" onclick="sh(-1)">‹</button><h2 style="flex:1;text-align:center;margin:0">${MES[M-1]} ${Y}</h2><button class="btn" onclick="sh(1)">›</button></div><div class="cal">${cells}</div><div class="leg"><span><s style="background:var(--fbd)"></s>Festivo</span><span><s style="background:var(--ac)"></s>Día seleccionado</span></div>${(()=>{const l=Object.entries(fest(Y)).filter(([k])=>k.startsWith(cm)).sort();return l.length?`<p class="mu" style="margin:6px 0 0">Festivos: ${l.map(([k,n])=>+k.slice(8)+" "+e(n)).join(" · ")}</p>`:""})()}</div>
 <div class="card"><h2>Agendar cita</h2><div class="row"><input type="date" value="${CF.f}" onchange="CF.f=this.value"><button type="button" class="tbtn" id="tb" onclick="openClock()">🕘 ${fmtH(CF.t)}</button><input type="hidden" id="ct" value="${CF.t}"><input class="w" placeholder="Cliente" list="cl" value="${e(CF.c)}" oninput="CF.c=this.value"><input class="w" placeholder="Servicio" value="${e(CF.s)}" oninput="CF.s=this.value"><input class="w" placeholder="Notas (opcional)" value="${e(CF.n)}" oninput="CF.n=this.value"><button class="btn p" onclick="addCita()">Agendar</button></div>
 <datalist id="cl">${[...new Set([...D.creditos.map(c=>c.n),...D.fijos.map(x=>x.c)])].map(c=>`<option value="${e(c)}">`).join("")}</datalist>
 <h2 style="margin-top:6px">Citas del ${fd(cd)}</h2>${HOL(cd)?`<p style="color:var(--ft);font-weight:700;margin:0 0 6px">🎉 Festivo: ${e(HOL(cd))}</p>`:""}${day.length?`<div class="sc"><table>${day.map(c=>`<tr><td><b>${fmtH(c.h)}</b></td><td>${e(c.c)}</td><td>${e(c.s)}${c.n?`<br><span class="mu">${e(c.n)}</span>`:""}</td><td><button class="x" onclick="D.citas=D.citas.filter(z=>z.id!=${c.id});save();render()">✕</button></td></tr>`).join("")}</table></div>`:'<p class="mu">Sin citas este día.</p>'}</div>
 <div class="card"><h2>Próximas citas</h2>${up.length?`<div class="sc"><table>${up.map(c=>`<tr><td>${fd(c.f)}</td><td><b>${fmtH(c.h)}</b></td><td>${e(c.c)}</td><td>${e(c.s)}</td></tr>`).join("")}</table></div>`:'<p class="mu">No hay citas próximas.</p>'}</div>`}
function addCita(){const t=g("ct")||CF.t;if(!CF.f||!t||!CF.c.trim())return alert("Completa fecha, hora y cliente");D.citas.push({id:Date.now(),f:CF.f,h:t,c:CF.c.trim(),s:CF.s.trim(),n:CF.n.trim()});cd=CF.f;cm=cd.slice(0,7);CF.c=CF.s=CF.n="";save();render()}
function rFij(){const l=D.fijos.map((x,i)=>[x,i]).sort((a,b)=>b[0].f.localeCompare(a[0].f));
 return `<div class="card"><h2>Registrar servicio (pago inmediato)</h2><div class="row"><input type="date" id="ff" value="${today()}"><input class="w" id="fc" placeholder="Cliente" list="cl2"><input class="w" id="fs" placeholder="Servicio"><input type="number" id="fv" placeholder="Valor"><button class="btn p" onclick="addF()">Agregar</button></div>
 <datalist id="cl2">${[...new Set(D.fijos.map(x=>x.c))].map(c=>`<option value="${e(c)}">`).join("")}</datalist>
 <div class="sc"><table><tr><th>Fecha</th><th>Cliente</th><th>Servicio</th><th class="n">Valor</th><th></th></tr>${l.map(([x,i])=>ed=="f"+i?`<tr><td><input type="date" id="e1" value="${x.f}"></td><td><input id="e2" value="${e(x.c)}"></td><td><input id="e3" value="${e(x.s)}"></td><td><input type="number" id="e4" value="${x.v}"></td><td class="n"><button class="x ed" onclick="saveF(${i})">✓</button><button class="x" onclick="ed='';render()">✕</button></td></tr>`:`<tr><td>${fd(x.f)}</td><td>${e(x.c)}</td><td>${e(x.s)}</td><td class="n">${$(x.v)}</td><td class="n"><button class="x ed" onclick="ed='f${i}';render()">✎</button><button class="x" onclick="D.fijos.splice(${i},1);save();render()">✕</button></td></tr>`).join("")}
 <tr class="tot"><td colspan="3">Total</td><td class="n">${$(sum(D.fijos.map(x=>x.v)))}</td><td></td></tr></table></div></div>
 <div class="card"><h2>Resumen por cliente</h2><div class="sc"><table><tr><th>Cliente</th><th class="n">Servicios</th><th class="n">Total</th></tr>${[...new Set(D.fijos.map(x=>x.c))].map(c=>{const a=D.fijos.filter(x=>x.c==c);return `<tr><td>${e(c)}</td><td class="n">${a.length}</td><td class="n">${$(sum(a.map(x=>x.v)))}</td></tr>`}).join("")}</table></div></div>`}
function rCre(){if(sel>=D.creditos.length)sel=0;const c=D.creditos[sel];
 let h=`<div class="card"><div class="row"><select onchange="sel=+this.value;ed='';render()" style="flex:2 1 160px">${D.creditos.map((x,i)=>`<option value="${i}" ${i==sel?"selected":""}>${e(x.n)}</option>`).join("")}</select><input id="nc" placeholder="Nuevo cliente con crédito"><button class="btn p" onclick="addC()">+ Cliente</button></div></div>`;
 if(!c)return h;const t=tot(c),ps=c.s.map((x,i)=>[x,i]).sort((a,b)=>a[0][0].localeCompare(b[0][0])),pp=c.p.map((x,i)=>[x,i]).sort((a,b)=>a[0][0].localeCompare(b[0][0]));
 return h+`<div class="kpis"><div class="kpi"><small>Valor servicios</small><b>${$(t.v)}</b></div><div class="kpi"><small>Abonos</small><b>${$(t.a)}</b></div><div class="kpi"><small>Saldo por pagar</small><b class="${t.d>0?"debe":"pag"}">${$(t.d)}</b></div></div>
 <div class="card"><h2>Servicios — ${e(c.n)}</h2><div class="row"><input type="date" id="sf" value="${today()}"><input class="w" id="ss" placeholder="Servicio"><input type="number" id="sv" placeholder="Valor"><button class="btn p" onclick="addS()">Agregar</button></div>
 <div class="sc"><table><tr><th>Fecha</th><th>Servicio</th><th class="n">Valor</th><th></th></tr>${ps.map(([x,i])=>ed=="s"+i?`<tr><td><input type="date" id="e1" value="${x[0]}"></td><td><input id="e3" value="${e(x[1])}"></td><td><input type="number" id="e4" value="${x[2]}"></td><td class="n"><button class="x ed" onclick="saveS(${i})">✓</button><button class="x" onclick="ed='';render()">✕</button></td></tr>`:`<tr><td>${fd(x[0])}</td><td>${e(x[1])}</td><td class="n">${$(x[2])}</td><td class="n"><button class="x ed" onclick="ed='s${i}';render()">✎</button><button class="x" onclick="D.creditos[sel].s.splice(${i},1);save();render()">✕</button></td></tr>`).join("")}<tr class="tot"><td colspan="2">Total valor</td><td class="n">${$(t.v)}</td><td></td></tr></table></div></div>
 <div class="card"><h2>Pagos / abonos</h2><div class="row"><input type="date" id="pf" value="${today()}"><input type="number" id="pv" placeholder="Abono"><button class="btn p" onclick="addP()">Registrar abono</button></div>
 <div class="sc"><table><tr><th>Fecha</th><th class="n">Abono</th><th></th></tr>${pp.map(([x,i])=>ed=="p"+i?`<tr><td><input type="date" id="e1" value="${x[0]}"></td><td><input type="number" id="e4" value="${x[1]}"></td><td class="n"><button class="x ed" onclick="saveP(${i})">✓</button><button class="x" onclick="ed='';render()">✕</button></td></tr>`:`<tr><td>${fd(x[0])||"sin fecha"}</td><td class="n">${$(x[1])}</td><td class="n"><button class="x ed" onclick="ed='p${i}';render()">✎</button><button class="x" onclick="D.creditos[sel].p.splice(${i},1);save();render()">✕</button></td></tr>`).join("")}<tr class="tot"><td>Total abonos</td><td class="n">${$(t.a)}</td><td></td></tr></table></div><p class="mu">Cada abono se suma al mes de su fecha.</p>
 <button class="btn" onclick="renC()">✎ Cambiar nombre</button> <button class="btn" onclick="if(confirm('¿Eliminar este cliente y todo su historial?')){D.creditos.splice(sel,1);sel=0;save();render()}">Eliminar cliente</button></div>`}
function addF(){const v=+g("fv");if(!g("ff")||!g("fc").trim()||!v)return alert("Completa fecha, cliente y valor");D.fijos.push({f:g("ff"),c:g("fc").trim(),s:g("fs").trim(),v});save();render()}
function saveF(i){const v=+g("e4");if(!g("e1")||!g("e2").trim()||!v)return alert("Completa fecha, cliente y valor");D.fijos[i]={f:g("e1"),c:g("e2").trim(),s:g("e3").trim(),v};ed="";save();render()}
function saveS(i){const v=+g("e4");if(!g("e1")||!v)return alert("Completa fecha y valor");D.creditos[sel].s[i]=[g("e1"),g("e3").trim(),v];ed="";save();render()}
function saveP(i){const v=+g("e4");if(!g("e1")||!v)return alert("Completa fecha y valor");D.creditos[sel].p[i]=[g("e1"),v];ed="";save();render()}
function renC(){const n=prompt("Nombre del cliente:",D.creditos[sel].n);if(n&&n.trim()){D.creditos[sel].n=n.trim();save();render()}}
function addC(){const n=g("nc").trim();if(!n)return;D.creditos.push({n,s:[],p:[]});sel=D.creditos.length-1;save();render()}
function addS(){const v=+g("sv");if(!g("sf")||!v)return alert("Completa fecha y valor");D.creditos[sel].s.push([g("sf"),g("ss").trim(),v]);save();render()}
function addP(){const v=+g("pv");if(!g("pf")||!v)return alert("Completa fecha y abono");D.creditos[sel].p.push([g("pf"),v]);save();render()}
function xls(){if(!window.XLSX)return alert("Para descargar el Excel conéctate a internet una vez.");
 const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
 const ys=years(),r=[["Año","Mes","Fijos","Abonos","Total"]];ys.forEach(y=>months(y).forEach((m,i)=>{if(m[0]+m[1])r.push([y,MES[i],m[0],m[1],m[0]+m[1]])}));add("Ingresos por mes",r);
 add("Clientes fijos",[["Fecha","Cliente","Servicio","Valor"],...D.fijos.map(x=>[x.f,x.c,x.s,x.v])]);
 add("Créditos servicios",[["Cliente","Fecha","Servicio","Valor"],...D.creditos.flatMap(c=>c.s.map(x=>[c.n,...x]))]);
 add("Abonos",[["Cliente","Fecha","Abono"],...D.creditos.flatMap(c=>c.p.map(x=>[c.n,x[0],x[1]]))]);
 add("Saldos",[["Cliente","Valor","Abonó","Saldo por pagar"],...D.creditos.map(c=>{const t=tot(c);return[c.n,t.v,t.a,t.d]})]);
 add("Citas",[["Fecha","Hora","Cliente","Servicio","Notas"],...D.citas.slice().sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h)).map(c=>[c.f,c.h,c.c,c.s,c.n])]);
 XLSX.writeFile(wb,"ingresos_lina_mosquera.xlsx")}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="respaldo_ingresos.json";a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.fijos&&x.creditos){D=x;D.citas=D.citas||[];save();render()}else alert("Archivo no válido")}catch(_){alert("Archivo no válido")}};r.readAsText(i.files[0])}
const TP={h:9,m:0,pm:false,mode:"h"};
function openClock(){
 const [a,b]=(CF.t||"09:00").split(":").map(Number);TP.h=a%12||12;TP.m=b;TP.pm=a>=12;TP.mode="h";
 let o=document.getElementById("clk");if(o)o.remove();
 o=document.createElement("div");o.id="clk";o.className="clk";
 o.innerHTML=`<div class="clkc" role="dialog" aria-label="Elegir hora"><h2>Elegir hora</h2>
 <div class="clkd"><button type="button" id="clh" onclick="clkMode('h')"></button><span>:</span><button type="button" id="clm" onclick="clkMode('m')"></button><div class="clap"><button type="button" id="cla" onclick="clkAp(0)">a. m.</button><button type="button" id="clp" onclick="clkAp(1)">p. m.</button></div></div>
 <svg id="clf" class="clkf" viewBox="0 0 240 240"></svg>
 <div class="clka"><button type="button" class="btn" onclick="clkClose()">Cancelar</button><button type="button" class="btn p" onclick="clkOk()">Aceptar</button></div></div>`;
 document.body.appendChild(o);
 o.addEventListener("pointerdown",ev=>{if(ev.target===o)clkClose()});
 const f=o.querySelector("#clf");let dn=false;
 const pick=ev=>{const r=f.getBoundingClientRect(),x=ev.clientX-r.left-r.width/2,y=ev.clientY-r.top-r.height/2;let an=Math.atan2(x,-y)*180/Math.PI;if(an<0)an+=360;
  if(TP.mode=="h")TP.h=Math.round(an/30)%12||12;else TP.m=Math.round(an/6)%60;clkDraw()};
 f.addEventListener("pointerdown",ev=>{dn=true;try{f.setPointerCapture(ev.pointerId)}catch(_){}pick(ev)});
 f.addEventListener("pointermove",ev=>{if(dn)pick(ev)});
 f.addEventListener("pointerup",()=>{if(!dn)return;dn=false;if(TP.mode=="h"){TP.mode="m";clkDraw()}});
 clkDraw()}
function clkDraw(){
 const p2=n=>String(n).padStart(2,"0"),H=TP.mode=="h",R=88,pos=a=>[120+R*Math.sin(a*Math.PI/180),120-R*Math.cos(a*Math.PI/180)],
 an=H?(TP.h%12)*30:TP.m*6,[sx,sy]=pos(an),$i=i=>document.getElementById(i);
 $i("clh").textContent=p2(TP.h);$i("clm").textContent=p2(TP.m);
 $i("clh").className=H?"on":"";$i("clm").className=H?"":"on";
 $i("cla").className=TP.pm?"":"on";$i("clp").className=TP.pm?"on":"";
 let s='<circle cx="120" cy="120" r="116" fill="var(--ac2)"/>';
 for(let i=0;i<12;i++){const [x,y]=pos(i*30);s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="16" fill="var(--tx)">${H?(i||12):p2(i*5)}</text>`}
 s+=`<line x1="120" y1="120" x2="${sx}" y2="${sy}" stroke="var(--ac)" stroke-width="2"/><circle cx="120" cy="120" r="4" fill="var(--ac)"/><circle cx="${sx}" cy="${sy}" r="20" fill="var(--ac)"/><text x="${sx}" y="${sy}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#fff">${H?TP.h:p2(TP.m)}</text>`;
 $i("clf").innerHTML=s}
function clkMode(m){TP.mode=m;clkDraw()}
function clkAp(p){TP.pm=!!p;clkDraw()}
function clkClose(){const o=document.getElementById("clk");if(o)o.remove()}
function clkOk(){const p2=n=>String(n).padStart(2,"0");CF.t=p2((TP.h%12)+(TP.pm?12:0))+":"+p2(TP.m);
 const c=document.getElementById("ct"),b=document.getElementById("tb");if(c)c.value=CF.t;if(b)b.textContent="🕘 "+fmtH(CF.t);clkClose()}

render();
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(_){}
</script></main></body></html>
